<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>人形牆大挑戰 (Shape Fit) - 完美版面修正版</title>
    <style>
        :root {
            --bg-color: #11131c;
            --panel-color: #1f222f;
            --text-color: #f1f5f9;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --border-color: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            padding: 10px;
        }

        /* 頂部「想像力實驗室」專屬 Logo 按鈕 */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-color);
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 1rem;
            color: var(--text-color);
            border: 2px solid #3b82f6;
            margin-bottom: 15px;
            z-index: 10;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .logo-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            background: #2d3245;
        }

        /* 2D 遊戲視窗容器：寬 1000px, 高度微調至 530px 以完美容納內容，配合 max-height 防斷 */
        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 530px;
            background: linear-gradient(180deg, #1f2937 0%, #0d1117 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.7);
            border: 5px solid var(--border-color);
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 頂部 HUD 面板 */
        .hud {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
            display: none;
        }

        .score-box {
            background: rgba(31, 34, 47, 0.8);
            padding: 8px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* 底部姿勢提示欄 */
        .pose-preview-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        .pose-dot {
            font-size: 0.9rem;
            color: #9ca3af;
            opacity: 0.5;
            transition: all 0.2s ease;
        }

        .pose-dot.active {
            color: var(--accent-green);
            font-weight: bold;
            opacity: 1;
        }

        /* 覆蓋大蓋板：優化結構與內邊距，防止按鈕被卡斷 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 19, 28, 0.96);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
            padding: 20px 40px;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
            text-align: center;
        }

        .overlay-subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            text-align: center;
            max-width: 85%;
            line-height: 1.5;
        }

        /* 緊湊型 10 種姿勢選擇網格：縮小尺寸，騰出上下空間 */
        .pose-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 850px;
            margin: 5px 0;
        }

        @media (max-width: 600px) {
            .pose-grid {
                grid-template-columns: repeat(3, 1fr);
                max-height: 220px;
                overflow-y: auto; /* 手機板如果太擠可支援滾動 */
            }
        }

        .pose-card {
            background: #252936;
            border: 2px solid #374151;
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .pose-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-1px);
        }

        .pose-card.selected {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        /* 縮小卡片畫布：從 70 縮至 55，完美釋放垂直空間 */
        .pose-card-canvas {
            background: #11131c;
            border-radius: 6px;
            width: 55px;
            height: 55px;
        }

        .pose-name {
            font-size: 0.75rem;
            font-weight: bold;
            color: #d1d5db;
        }

        .selection-counter {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
            color: white;
            border: none;
            padding: 12px 50px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .play-btn:disabled {
            background: #374151;
            color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        .play-btn:not(:disabled):hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.5);
        }

        /* 底部控制指南 */
        .footer-info {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            line-height: 1.6;
        }

        .highlight {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 頂部「想像力實驗室」專屬 Logo 按鈕 -->
    <a href="#" class="logo-container" onclick="event.preventDefault();">
        <span class="logo-icon">✨</span>
        <span class="logo-text">想像力實驗室</span>
    </a>

    <!-- 遊戲主體視窗 -->
    <div class="game-wrapper" id="game-zone">
        
        <!-- 核心渲染畫布：內部仍渲染 1000x500 的標準遊戲畫面 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 儀表板 HUD -->
        <div class="hud" id="game-hud">
            <div class="score-box" style="color: #38bdf8;">SCORE: <span id="score-val">0</span></div>
            <div class="score-box" style="color: #f59e0b;">HI-SCORE: <span id="hi-score-val">0</span></div>
        </div>

        <!-- 底部姿勢動態提示欄 -->
        <div class="pose-preview-bar" id="game-pose-bar"></div>

        <!-- 遊戲大覆蓋層 -->
        <div class="overlay" id="overlay">
            <h2 class="overlay-title" id="overlay-title">人形牆大挑戰 (客製版)</h2>
            <p class="overlay-subtitle" id="overlay-desc">
                請先從下方 10 種魔性人體動作中，<span class="highlight">勾選最想挑戰的 5 個姿勢</span>，隨後即可啟動極速穿牆關卡！
            </p>
            
            <div class="selection-counter" id="select-counter">目前已選擇：0 / 5</div>

            <!-- 10 種可選姿勢卡片選單 -->
            <div class="pose-grid" id="menu-pose-grid"></div>

            <button class="play-btn" id="start-btn" onclick="startGame(event)" disabled>開始挑戰</button>
        </div>

    </div>

    <div class="footer-info">
        操作指南：直接 <span class="highlight">點擊滑鼠左鍵</span>、觸摸 <span class="highlight">手機螢幕任意處</span> 或按下 <span class="highlight">空白鍵 (Space)</span> 輪流切換這 5 種自選動作。<br>
        由 <strong>想像力實驗室</strong> 榮譽出品
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const selectCounter = document.getElementById('select-counter');
        const menuPoseGrid = document.getElementById('menu-pose-grid');
        const gameHud = document.getElementById('game-hud');
        const gamePoseBar = document.getElementById('game-pose-bar');
        const scoreVal = document.getElementById('score-val');
        const hiScoreVal = document.getElementById('hi-score-val');

        // 畫布渲染大小保持 1000x500，外框 CSS 設為 530px 高，多出的 30px 做為底部和頂部的緩衝區
        canvas.width = 1000;
        canvas.height = 500;

        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = canvas.width;
        offscreenCanvas.height = canvas.height;
        const offscreenCtx = offscreenCanvas.getContext('2d');

        let isPlaying = false;
        let score = 0;
        let hiScore = 0;
        let wallSpeed = 4.5;
        let successGlowTimer = 0;
        let walls = [];
        let wallSpawnTimer = 0;
        const BASELINE_Y = 360; 

        const ALL_POSE_NAMES = [
            "1. 立正", "2. 展翅", "3. 大字", "4. 金雞獨立", "5. 頂天立地",
            "6. 思想者", "7. 埃及壁畫", "8. 閃電人形", "9. 芭蕾舞姿", "10. 鋼鐵人"
        ];

        function drawSkeleton(context, cx, cy, poseIndex, isHole = false, strokeColor = '#10b981') {
            context.save();
            if (isHole) {
                context.globalCompositeOperation = 'destination-out';
                context.strokeStyle = 'rgba(0,0,0,1)';
                context.fillStyle = 'rgba(0,0,0,1)';
                context.lineWidth = 14; 
            } else {
                context.strokeStyle = strokeColor;
                context.fillStyle = strokeColor;
                context.lineWidth = 10;
            }
            context.lineCap = 'round';
            context.lineJoin = 'round';

            let headX = cx;
            let headY = cy - 60;
            let spineTopX = cx;
            let spineTopY = cy - 48;
            let spineBottomX = cx;
            let spineBottomY = cy;

            if (poseIndex === 5) { 
                headY += 15; spineTopY += 15; spineBottomY += 5;
            } else if (poseIndex === 9) { 
                headY += 35; spineTopY += 35; spineBottomY += 25;
                spineBottomX -= 10; spineTopX -= 5; headX -= 5;
            }

            context.beginPath();
            if (poseIndex === 3) { 
                context.arc(headX - 4, headY - 2, 12, 0, Math.PI * 2);
            } else {
                context.arc(headX, headY, 12, 0, Math.PI * 2);
            }
            context.fill();

            context.beginPath();
            context.moveTo(spineTopX, spineTopY);
            context.lineTo(spineBottomX, spineBottomY);
            context.stroke();

            context.beginPath();
            switch (poseIndex) {
                case 0: 
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx - 12, cy - 10);
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx + 12, cy - 10);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 8, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 8, cy + 45);
                    break;
                case 1: 
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx - 32, cy - 65);
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx + 32, cy - 65);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 18, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 18, cy + 45);
                    break;
                case 2: 
                    context.moveTo(spineTopX, spineTopY + 13); context.lineTo(cx - 38, cy - 35);
                    context.moveTo(spineTopX, spineTopY + 13); context.lineTo(cx + 38, cy - 35);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 32, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 32, cy + 45);
                    break;
                case 3: 
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx - 25, cy - 40);
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx + 18, cy - 30); context.lineTo(cx + 5, cy - 10);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 10, cy + 45); 
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 20, cy + 10); context.lineTo(cx - 5, cy + 15); 
                    break;
                case 4: 
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx - 15, cy - 75);
                    context.moveTo(spineTopX, spineTopY + 8); context.lineTo(cx + 15, cy - 75);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 25, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 25, cy + 45);
                    break;
                case 5: 
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx + 18, cy + 10); context.lineTo(headX + 5, headY + 15);
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx - 15, cy + 25);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 22, cy + 15); context.lineTo(cx - 15, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 22, cy + 20); context.lineTo(cx + 20, cy + 45);
                    break;
                case 6: 
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx - 25, spineTopY + 5); context.lineTo(cx - 25, cy - 70);
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx + 25, spineTopY + 5); context.lineTo(cx + 25, cy - 20);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 20, spineBottomY); context.lineTo(cx - 20, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 20, spineBottomY); context.lineTo(cx + 20, cy + 45);
                    break;
                case 7: 
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx + 30, cy - 65);
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx - 10, cy - 25);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 30, cy + 25); context.lineTo(cx - 25, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 15, cy + 45);
                    break;
                case 8: 
                    context.moveTo(spineTopX, spineTopY + 5); context.quadraticCurveTo(cx - 25, cy - 65, cx - 2, cy - 80);
                    context.moveTo(spineTopX, spineTopY + 5); context.quadraticCurveTo(cx + 25, cy - 65, cx + 2, cy - 80);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 20, cy + 20); context.lineTo(cx + 5, cy + 25);
                    break;
                case 9: 
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx - 32, cy + 45); 
                    context.moveTo(spineTopX, spineTopY + 5); context.lineTo(cx + 25, cy + 15); context.lineTo(cx + 35, cy + 30);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx - 28, cy + 25); context.lineTo(cx - 10, cy + 45);
                    context.moveTo(spineBottomX, spineBottomY); context.lineTo(cx + 15, cy + 45);
                    break;
            }
            context.stroke();
            context.restore();
        }

        let chosenPoses = []; 
        let currentPose = 0;

        function initCustomMenu() {
            menuPoseGrid.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const card = document.createElement('div');
                card.className = 'pose-card';
                card.dataset.id = i;

                const cardCanvas = document.createElement('canvas');
                cardCanvas.className = 'pose-card-canvas';
                cardCanvas.width = 100;
                cardCanvas.height = 100;

                const nameSpan = document.createElement('div');
                nameSpan.className = 'pose-name';
                nameSpan.textContent = ALL_POSE_NAMES[i].split('. ')[1]; 

                card.appendChild(cardCanvas);
                card.appendChild(nameSpan);
                menuPoseGrid.appendChild(card);

                const cCtx = cardCanvas.getContext('2d');
                cCtx.fillStyle = '#11131c';
                cCtx.fillRect(0, 0, 100, 100);
                drawSkeleton(cCtx, 50, 68, i, false, '#10b981');

                card.addEventListener('click', () => toggleMenuPose(i, card));
            }
        }

        function toggleMenuPose(index, cardEl) {
            const pos = chosenPoses.indexOf(index);
            if (pos > -1) {
                chosenPoses.splice(pos, 1);
                cardEl.classList.remove('selected');
            } else {
                if (chosenPoses.length < 5) {
                    chosenPoses.push(index);
                    cardEl.classList.add('selected');
                }
            }

            selectCounter.textContent = `目前已選擇：${chosenPoses.length} / 5`;
            startBtn.disabled = (chosenPoses.length !== 5);
        }

        let activePoseIndex = 0; 

        function changePose() {
            if (!isPlaying) return;
            activePoseIndex = (activePoseIndex + 1) % 5;
            currentPose = chosenPoses[activePoseIndex]; 
            playSound('pose');
            updateGamePoseBarHUD();
        }

        document.getElementById('game-zone').addEventListener('mousedown', function(e) {
            if (e.target !== startBtn && !e.target.closest('.pose-card')) {
                changePose();
            }
        });
        document.getElementById('game-zone').addEventListener('touchstart', function(e) {
            if (e.target !== startBtn && !e.target.closest('.pose-card')) {
                e.preventDefault();
                changePose();
            }
        });
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isPlaying && chosenPoses.length === 5) startGame();
                else changePose();
            }
        });

        function updateGamePoseBarHUD() {
            for (let i = 0; i < 5; i++) {
                const dot = document.getElementById(`g-dot-${i}`);
                if (dot) {
                    if (i === activePoseIndex) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                }
            }
        }

        function startGame(e) {
            if (e) e.stopPropagation();
            if (chosenPoses.length !== 5) return;

            isPlaying = true;
            score = 0;
            wallSpeed = 4.5;
            activePoseIndex = 0;
            currentPose = chosenPoses[0];
            successGlowTimer = 0;
            walls = [];
            wallSpawnTimer = 0;

            scoreVal.textContent = score;

            gamePoseBar.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const span = document.createElement('span');
                span.className = 'pose-dot';
                span.id = `g-dot-${i}`;
                span.textContent = `${i+1}. ` + ALL_POSE_NAMES[chosenPoses[i]].split('. ')[1];
                gamePoseBar.appendChild(span);
            }

            gameHud.style.display = 'flex';
            gamePoseBar.style.display = 'flex';
            overlay.style.display = 'none';

            updateGamePoseBarHUD();
            requestAnimationFrame(gameLoop);
        }

        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if (type === 'pose') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(640, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'pass') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); 
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); 
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(35, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {}
        }

        function spawnWall() {
            const randomChosenIdx = Math.floor(Math.random() * 5);
            const globalPoseId = chosenPoses[randomChosenIdx];
            walls.push({
                x: canvas.width + 50,
                shape: globalPoseId,
                checked: false
            });
        }

        function gameLoop() {
            if (!isPlaying) return;

            wallSpawnTimer--;
            if (wallSpawnTimer <= 0) {
                spawnWall();
                wallSpawnTimer = Math.max(110, 200 - score * 3);
            }

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, BASELINE_Y + 45);
            ctx.lineTo(canvas.width, BASELINE_Y + 45);
            ctx.stroke();

            offscreenCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);

            for (let i = walls.length - 1; i >= 0; i--) {
                let wall = walls[i];
                wall.x -= wallSpeed;

                offscreenCtx.save();
                offscreenCtx.fillStyle = '#ffffff';
                offscreenCtx.fillRect(wall.x - 45, BASELINE_Y - 100, 90, 145);

                drawSkeleton(offscreenCtx, wall.x, BASELINE_Y, wall.shape, true);
                offscreenCtx.restore();

                if (!wall.checked && wall.x <= 200) {
                    wall.checked = true;

                    if (currentPose === wall.shape) {
                        score += 10;
                        scoreVal.textContent = score;
                        playSound('pass');
                        successGlowTimer = 25;

                        if (score % 30 === 0) {
                            wallSpeed += 0.5;
                        }
                    } else {
                        gameOver(wall.shape);
                        return;
                    }
                }

                if (wall.x < -80) {
                    walls.splice(i, 1);
                }
            }

            ctx.save();
            ctx.shadowColor = '#3b82f6';
            ctx.shadowBlur = 12;
            ctx.drawImage(offscreenCanvas, 0, 0);
            ctx.restore();

            ctx.save();
            if (successGlowTimer > 0) {
                successGlowTimer--;
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 25;
                drawSkeleton(ctx, 200, BASELINE_Y, currentPose, false, '#f59e0b');
            } else {
                ctx.shadowColor = '#10b981';
                ctx.shadowBlur = 10;
                drawSkeleton(ctx, 200, BASELINE_Y, currentPose, false, '#10b981');
            }
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function gameOver(correctGlobalPoseId) {
            isPlaying = false;
            playSound('fail');

            if (score > hiScore) {
                hiScore = score;
                hiScoreVal.textContent = hiScore;
            }

            document.getElementById('overlay-title').textContent = "挑戰失敗！";
            document.getElementById('overlay-title').style.textShadow = "0 0 25px rgba(239, 68, 68, 0.8)";
            
            const correctName = ALL_POSE_NAMES[correctGlobalPoseId].split('. ')[1];

            overlayDesc.innerHTML = `
                哎呀！身體姿勢跟紙板缺口不合，狠狠撞上去啦！<br>
                剛剛迎面而來的正確缺口姿勢是：<span style="color:#f59e0b; font-weight:bold;">【${correctName}】</span><br><br>
                本次自選穿牆挑戰最終得分：<span class="highlight" style="font-size:1.4rem;">${score}</span> 分！
            `;
            
            chosenPoses = [];
            startBtn.disabled = true;
            selectCounter.textContent = `目前已選擇：0 / 5`;
            
            initCustomMenu(); 

            gameHud.style.display = 'none';
            gamePoseBar.style.display = 'none';
            overlay.style.display = 'flex';
        }

        initCustomMenu();
    </script>
</body>
