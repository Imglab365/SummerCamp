<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>彩虹記憶考驗 - 想像力實驗室</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --text-color: #f8fafc;
            --accent-blue: #3b82f6;
            --border-color: #334155;
            
            /* 7種顏色 */
            --color-0: #ef4444; /* 紅 */
            --color-1: #f97316; /* 橙 */
            --color-2: #eab308; /* 黃 */
            --color-3: #22c55e; /* 綠 */
            --color-4: #0ea5e9; /* 藍 */
            --color-5: #6366f1; /* 靛 */
            --color-6: #a855f7; /* 紫 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: manipulation; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
            overflow: hidden;
        }

        /* Logo */
        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-color);
            padding: 10px 25px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--text-color);
            border: 2px solid var(--accent-blue);
            margin-bottom: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 1.5rem;
        }

        /* 遊戲容器 */
        .game-wrapper {
            background: var(--panel-color);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid var(--border-color);
            position: relative;
        }

        /* 計分板 */
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0f172a;
            padding: 10px 25px;
            border-radius: 15px;
            border: 2px solid var(--border-color);
        }

        .score-label {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: #f8fafc;
            font-family: monospace;
        }

        .high-score-value {
            color: #fbbf24; /* 金色 */
        }

        /* 狀態提示字 */
        .status-display {
            font-size: 2.5rem;
            font-weight: 900;
            height: 60px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: color 0.3s;
        }

        /* 彩虹琴鍵 (按鈕) */
        .keys-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            height: 250px;
            padding: 20px 0;
        }

        .key-btn {
            flex: 1;
            max-width: 80px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 10px 0 rgba(0,0,0,0.5), inset 0 5px 10px rgba(255,255,255,0.3);
            border: none;
            outline: none;
            opacity: 0.6; /* 預設略暗 */
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .keys-container { gap: 8px; height: 200px; }
            .key-btn { border-radius: 12px; }
            .status-display { font-size: 1.8rem; }
        }

        /* 琴鍵顏色分配 */
        .key-0 { background-color: var(--color-0); }
        .key-1 { background-color: var(--color-1); }
        .key-2 { background-color: var(--color-2); }
        .key-3 { background-color: var(--color-3); }
        .key-4 { background-color: var(--color-4); }
        .key-5 { background-color: var(--color-5); }
        .key-6 { background-color: var(--color-6); }

        /* 琴鍵按下/發亮狀態 */
        .key-btn.active {
            opacity: 1;
            filter: brightness(1.3);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 5px 10px rgba(255,255,255,0.5), 0 0 30px currentColor;
            transform: translateY(8px);
        }

        /* 點擊時強制觸發按壓視覺 */
        .key-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5), inset 0 5px 10px rgba(255,255,255,0.3);
        }

        /* 遊戲結束/開始 覆蓋層 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            border-radius: 20px;
        }

        .overlay-title {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(to right, var(--color-0), var(--color-2), var(--color-4), var(--color-6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .overlay-desc {
            font-size: 1.2rem;
            color: #cbd5e1;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 80%;
        }

        .play-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
        }
        .play-btn:hover { transform: scale(1.05); }

    </style>
</head>
<body>

    <a href="#" class="logo-container" onclick="event.preventDefault();">
        <span class="logo-icon">🌈</span>
        <span>想像力實驗室</span>
    </a>

    <div class="game-wrapper">
        
        <div class="scoreboard">
            <div class="score-box">
                <div class="score-label">當前記憶數</div>
                <div class="score-value" id="current-score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">最高紀錄</div>
                <div class="score-value high-score-value" id="high-score">0</div>
            </div>
        </div>

        <div class="status-display" id="status-text">準備開始</div>

        <div class="keys-container" id="keys-container">
            <button class="key-btn key-0" data-index="0" style="color: var(--color-0)"></button>
            <button class="key-btn key-1" data-index="1" style="color: var(--color-1)"></button>
            <button class="key-btn key-2" data-index="2" style="color: var(--color-2)"></button>
            <button class="key-btn key-3" data-index="3" style="color: var(--color-3)"></button>
            <button class="key-btn key-4" data-index="4" style="color: var(--color-4)"></button>
            <button class="key-btn key-5" data-index="5" style="color: var(--color-5)"></button>
            <button class="key-btn key-6" data-index="6" style="color: var(--color-6)"></button>
        </div>

        <!-- 初始/結束畫面 -->
        <div class="overlay" id="overlay">
            <div class="overlay-title" id="overlay-title">彩虹記憶</div>
            <div class="overlay-desc" id="overlay-desc">
                記住電腦亮起的順序，並準確地重複彈奏出來！<br>
                第一關會從 3 個按鍵開始，之後每過一關會多增加一個。
            </div>
            <button class="play-btn" id="start-btn" onclick="startGame()">開始挑戰</button>
        </div>

    </div>

    <script>
        // 音效系統 (產生 Do, Re, Mi, Fa, Sol, La, Si 七個音階)
        const FREQUENCIES = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playNote(index) {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; // 正弦波音色比較柔和
                osc.frequency.setValueAtTime(FREQUENCIES[index], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {}
        }

        function playErrorSound() {
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {}
        }

        // 遊戲變數
        let sequence = [];
        let playerStep = 0;
        let isPlayerTurn = false;
        let isPlaying = false;
        
        let currentScore = 0; // 成功記住的按鍵數
        // 讀取最高紀錄
        let highScore = parseInt(localStorage.getItem('rainbowMemoryHighScore')) || 0;
        document.getElementById('high-score').textContent = highScore;

        // UI 元素
        const statusText = document.getElementById('status-text');
        const overlay = document.getElementById('overlay');
        const keys = document.querySelectorAll('.key-btn');

        // 綁定點擊事件
        keys.forEach(key => {
            key.addEventListener('mousedown', (e) => handleKeyClick(e.target.dataset.index));
            key.addEventListener('touchstart', (e) => {
                e.preventDefault(); // 防止雙擊放大
                handleKeyClick(e.target.dataset.index);
            }, {passive: false});
        });

        function handleKeyClick(indexStr) {
            if (!isPlaying || !isPlayerTurn) return;

            const index = parseInt(indexStr);
            lightUpButton(index);

            // 檢查是否按對
            if (index === sequence[playerStep]) {
                playerStep++;
                
                // 如果整個序列都按對了
                if (playerStep === sequence.length) {
                    isPlayerTurn = false;
                    currentScore = sequence.length;
                    document.getElementById('current-score').textContent = currentScore;
                    
                    if (currentScore > highScore) {
                        highScore = currentScore;
                        document.getElementById('high-score').textContent = highScore;
                        localStorage.setItem('rainbowMemoryHighScore', highScore);
                    }

                    setStatus("正確！準備下一回合...", "#22c55e");
                    
                    // 進入下一回合：增加一個新的亂數按鍵
                    setTimeout(() => {
                        sequence.push(Math.floor(Math.random() * 7));
                        playComputerTurn();
                    }, 1000);
                }
            } else {
                // 按錯了
                gameOver();
            }
        }

        function lightUpButton(index) {
            playNote(index);
            const btn = document.querySelector(`.key-${index}`);
            btn.classList.add('active');
            
            setTimeout(() => {
                btn.classList.remove('active');
            }, 300); // 視覺發亮 0.3 秒
        }

        function startGame() {
            initAudio();
            overlay.style.display = 'none';
            isPlaying = true;
            currentScore = 0;
            document.getElementById('current-score').textContent = currentScore;
            
            // 初始化：隨機產生前 3 個按鍵
            sequence = [];
            for(let i=0; i<3; i++) {
                sequence.push(Math.floor(Math.random() * 7));
            }
            
            playComputerTurn();
        }

        function playComputerTurn() {
            isPlayerTurn = false;
            playerStep = 0;
            setStatus("電腦展示中...", "#3b82f6");

            let step = 0;
            
            // 延遲一點點再開始播，讓玩家有準備時間
            setTimeout(() => {
                const interval = setInterval(() => {
                    lightUpButton(sequence[step]);
                    step++;

                    if (step >= sequence.length) {
                        clearInterval(interval);
                        // 電腦播完後，換玩家
                        setTimeout(() => {
                            isPlayerTurn = true;
                            setStatus("換你了！", "#f59e0b");
                        }, 800);
                    }
                }, 800); // 每個按鍵之間的間隔 (包含 0.5s 顯示 + 0.3s 空白)
            }, 1000);
        }

        function setStatus(text, color) {
            statusText.textContent = text;
            statusText.style.color = color;
        }

        function gameOver() {
            isPlaying = false;
            isPlayerTurn = false;
            playErrorSound();
            
            document.getElementById('overlay-title').textContent = "挑戰結束！";
            document.getElementById('overlay-title').style.background = "linear-gradient(to right, #ef4444, #f97316)";
            document.getElementById('overlay-title').style.webkitBackgroundClip = "text";
            
            document.getElementById('overlay-desc').innerHTML = `
                哎呀，按錯順序了！<br>
                你這次成功記住了 <span style="color:#fbbf24; font-size:1.5rem; font-weight:bold;">${currentScore}</span> 個按鍵。<br>
                再來挑戰一次，突破你的極限吧！
            `;
            
            document.getElementById('start-btn').textContent = "重新挑戰";
            
            setTimeout(() => {
                overlay.style.display = 'flex';
            }, 500);
        }

    </script>
</body>
</html>
