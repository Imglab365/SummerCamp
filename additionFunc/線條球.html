<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法畫筆引導 (終極修正版) - 想像力實驗室</title>
    
    <!-- 引入 Matter.js 物理引擎 (多重 CDN 自動備援機制) -->
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
    <script>
        if (typeof Matter === 'undefined') {
            document.write('<script src="https://unpkg.com/matter-js@0.19.0/build/matter.min.js"><\/script>');
        }
    </script>
    <script>
        if (typeof Matter === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"><\/script>');
        }
    </script>

    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --text-color: #f8fafc;
            --accent-blue: #06b6d4;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-green: #10b981;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Logo */
        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--panel-color);
            padding: 12px 30px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-weight: bold;
            font-size: 1.4rem;
            color: var(--text-color);
            border: 2px solid var(--accent-purple);
            margin-bottom: 20px;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }
        .logo-icon { font-size: 1.8rem; }

        /* 主容器 */
        .game-wrapper {
            background: var(--panel-color);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 1000px;
            border: 4px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* 選單畫面 */
        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            min-height: 600px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .menu-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 15px; background: linear-gradient(to right, var(--accent-blue), var(--accent-purple), var(--accent-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(168, 85, 247, 0.4); }
        
        .rules-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--accent-purple);
            border-radius: 20px;
            padding: 25px 35px;
            margin-bottom: 40px;
            max-width: 700px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.1);
        }
        .rules-title { font-weight: bold; font-size: 1.5rem; color: var(--accent-pink); margin-bottom: 15px; }
        .rules-desc { font-size: 1.2rem; color: #cbd5e1; line-height: 1.6; }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .level-btn {
            aspect-ratio: 1;
            border-radius: 20px;
            font-size: 2.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 4px solid var(--accent-purple);
            background: transparent;
            color: var(--accent-purple);
            transition: all 0.2s;
            box-shadow: inset 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .level-btn:hover:not(.locked) {
            transform: translateY(-5px);
            background: var(--accent-purple);
            color: white;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.6);
        }

        .level-btn.locked {
            border-color: #475569;
            color: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 遊戲畫面 */
        .game-screen { display: none; flex-direction: column; width: 100%; position: relative; }

        .game-hud {
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }

        .hud-left, .hud-right { display: flex; gap: 15px; pointer-events: auto; flex-wrap: wrap;}

        .hud-btn {
            background: rgba(15, 23, 42, 0.85); border: 3px solid var(--accent-blue);
            padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            color: var(--accent-blue); transition: all 0.2s; backdrop-filter: blur(4px);
        }
        .hud-btn:hover { background: var(--accent-blue); color: white; }

        .btn-play { border-color: var(--accent-green); color: var(--accent-green); }
        .btn-play:hover { background: var(--accent-green); color: white; }

        .btn-clear { border-color: var(--accent-pink); color: var(--accent-pink); }
        .btn-clear:hover { background: var(--accent-pink); color: white; }

        .level-display {
            background: rgba(15, 23, 42, 0.85); padding: 10px 25px; border-radius: 25px;
            font-weight: bold; font-size: 1.3rem; color: white;
            border: 3px solid var(--border-color); backdrop-filter: blur(4px);
        }

        canvas { display: block; width: 100%; aspect-ratio: 4/3; background: #020617; cursor: crosshair; }

        /* 彈出視窗 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 50; display: none;
        }

        .modal-box {
            background: var(--panel-color); padding: 50px; border-radius: 25px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); border: 4px solid var(--accent-purple);
            transform: scale(0.9); animation: popIn 0.3s forwards; min-width: 400px;
        }

        @keyframes popIn { to { transform: scale(1); } }

        .modal-title { font-size: 3rem; font-weight: 900; margin-bottom: 15px; color: var(--accent-green); text-shadow: 0 0 20px rgba(34,197,94,0.4); }
        .modal-desc { font-size: 1.3rem; color: #cbd5e1; margin-bottom: 30px; }

        .modal-btns { display: flex; gap: 15px; justify-content: center; }

        .m-btn {
            padding: 15px 35px; font-size: 1.3rem; font-weight: bold; border-radius: 35px;
            cursor: pointer; border: none; color: white; transition: transform 0.2s;
        }
        .m-btn:hover { transform: scale(1.05); }
        .btn-secondary { background: #475569; }
        .btn-primary { background: var(--accent-purple); box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); }

    </style>
</head>
<body>

    <a href="#" class="logo-container" onclick="event.preventDefault(); returnToMenu();">
        <span class="logo-icon">🪄</span>
        <span>想像力實驗室</span>
    </a>

    <div class="game-wrapper">
        <!-- 主選單 -->
        <div class="menu-screen" id="menu-screen">
            <h1 class="menu-title">魔法畫筆引導</h1>
            
            <div class="rules-box">
                <div class="rules-title">📜 遊戲規則</div>
                <div class="rules-desc">
                    在畫面上<strong>拖曳畫出魔法線條</strong>，建立橋樑或溜滑梯。<br>
                    畫好之後，點擊 <strong>「▶️ 落下魔法球」</strong>，讓球受重力滾動。<br>
                    成功引導魔法球進入<strong>發光的傳送門</strong>即可通關！<br>
                    (如果失敗，可以點擊重置球調整路線，或是清除重畫)
                </div>
            </div>
            
            <div class="level-grid" id="level-grid">
                <!-- 由 JavaScript 確保渲染生成 -->
            </div>
        </div>

        <!-- 遊戲畫面 -->
        <div class="game-screen" id="game-screen">
            <div class="game-hud">
                <div class="hud-left">
                    <button class="hud-btn" onclick="returnToMenu()">❮ 返回</button>
                    <button class="hud-btn btn-clear" onclick="clearLines()">🗑️ 清除畫線</button>
                    <button class="hud-btn btn-play" id="play-btn" onclick="togglePlay()">▶️ 落下魔法球</button>
                </div>
                <div class="hud-right">
                    <div class="level-display" id="level-display">關卡 1</div>
                </div>
            </div>

            <!-- Canvas 大幅升級解析度 1000 x 750 -->
            <canvas id="gameCanvas" width="1000" height="750"></canvas>

            <!-- 彈出視窗 -->
            <div class="modal-overlay" id="modal-overlay">
                <div class="modal-box">
                    <h2 class="modal-title" id="modal-title">精準抵達！</h2>
                    <p class="modal-desc" id="modal-desc">魔法球成功進入了傳送門！</p>
                    <div class="modal-btns" id="modal-btns">
                        <button class="m-btn btn-secondary" onclick="returnToMenu()">返回選單</button>
                        <button class="m-btn btn-primary" id="next-level-btn" onclick="nextLevel()">下一關 ❯</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 音效系統
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                if (type === 'draw') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800 + Math.random()*200, ctx.currentTime);
                    gain.gain.setValueAtTime(0.01, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                } else if (type === 'bounce') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(300, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                } else if (type === 'win') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1); osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                }
                
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        // 遊戲狀態與變數
        const TOTAL_LEVELS = 10;
        let unlockedLevel = 1; // 每次重整皆從第一關開始
        let currentLevelIndex = 1;
        
        let engine, runner;
        let ball = null;
        let goal;
        let obstacles = [];
        let drawnLines = []; 
        let allStrokes = []; 
        let currentStroke = [];
        
        let isBallMoving = false;
        let isDrawing = false;
        let lastDrawPos = null;
        let isGameOver = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 關卡配置
        const LEVEL_DATA = {
            1: { ballStart: { x: 125, y: 187 }, goalPos: { x: 875, y: 562 }, obstacles: [] },
            2: { ballStart: { x: 125, y: 187 }, goalPos: { x: 875, y: 562 }, obstacles: [ { x: 500, y: 375, w: 50, h: 375 } ] },
            3: { ballStart: { x: 500, y: 100 }, goalPos: { x: 500, y: 625 }, obstacles: [ { x: 500, y: 312, w: 625, h: 37 } ] },
            4: { ballStart: { x: 875, y: 125 }, goalPos: { x: 125, y: 625 }, obstacles: [ { x: 625, y: 312, w: 500, h: 37 }, { x: 375, y: 562, w: 500, h: 37 } ] },
            5: { ballStart: { x: 125, y: 125 }, goalPos: { x: 875, y: 250 }, obstacles: [ { x: 500, y: 200, w: 40, h: 500 } ] },
            6: { ballStart: { x: 125, y: 100 }, goalPos: { x: 875, y: 625 }, obstacles: [ { x: 375, y: 250, w: 100, h: 30 }, { x: 625, y: 400, w: 100, h: 30 } ] },
            7: { ballStart: { x: 875, y: 100 }, goalPos: { x: 875, y: 625 }, obstacles: [ { x: 500, y: 375, w: 800, h: 40 } ] },
            8: { ballStart: { x: 125, y: 125 }, goalPos: { x: 875, y: 125 }, obstacles: [ { x: 500, y: 375, w: 40, h: 500 }, { x: 250, y: 500, w: 300, h: 40 }, { x: 750, y: 500, w: 300, h: 40 } ] },
            9: { ballStart: { x: 500, y: 100 }, goalPos: { x: 500, y: 650 }, obstacles: [ { x: 350, y: 400, w: 40, h: 400 }, { x: 650, y: 400, w: 40, h: 400 }, { x: 500, y: 300, w: 150, h: 40 } ] },
            10: { ballStart: { x: 100, y: 100 }, goalPos: { x: 900, y: 100 }, obstacles: [ { x: 300, y: 0, w: 40, h: 400 }, { x: 700, y: 750, w: 40, h: 400 }, { x: 500, y: 375, w: 300, h: 40 } ] }
        };

        function renderMenu() {
            const grid = document.getElementById('level-grid');
            if(!grid) return;
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const btn = document.createElement('div');
                btn.className = `level-btn ${i > unlockedLevel ? 'locked' : ''}`;
                btn.textContent = i;
                if (i <= unlockedLevel) {
                    btn.onclick = () => loadLevel(i);
                }
                grid.appendChild(btn);
            }
        }

        document.addEventListener('DOMContentLoaded', renderMenu);

        function returnToMenu() {
            if(runner && typeof Matter !== 'undefined') Matter.Runner.stop(runner);
            if(engine && typeof Matter !== 'undefined') Matter.Engine.clear(engine);
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
            renderMenu();
        }

        // --- 滑鼠與觸控繪圖邏輯 ---
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (isBallMoving || isGameOver) return;
            isDrawing = true;
            lastDrawPos = getMousePos(e);
            currentStroke = [lastDrawPos];
            allStrokes.push(currentStroke);
        }

        function stopDrawing() {
            isDrawing = false;
            lastDrawPos = null;
        }

        function drawPath(e) {
            if (!isDrawing || isBallMoving || isGameOver || typeof Matter === 'undefined') return;
            const currentPos = getMousePos(e);
            
            const dist = Math.hypot(currentPos.x - lastDrawPos.x, currentPos.y - lastDrawPos.y);
            
            if (dist > 12) {
                const angle = Math.atan2(currentPos.y - lastDrawPos.y, currentPos.x - lastDrawPos.x);
                const midX = (lastDrawPos.x + currentPos.x) / 2;
                const midY = (lastDrawPos.y + currentPos.y) / 2;
                
                // 【核心修正1】線條加上圓角 (chamfer) 避免接縫撞擊，完全去除摩擦力
                const lineBody = Matter.Bodies.rectangle(midX, midY, dist + 4, 10, {
                    isStatic: true,
                    angle: angle,
                    friction: 0, 
                    restitution: 0.1, // 軌道低彈性，讓球貼合
                    chamfer: { radius: 4 }, // 圓角是關鍵，消除接縫碰撞
                    label: 'drawnLine'
                });
                
                Matter.Composite.add(engine.world, lineBody);
                drawnLines.push(lineBody);
                
                currentStroke.push(currentPos);
                lastDrawPos = currentPos;
                if(Math.random() > 0.5) playSound('draw');
            }
        }

        canvas.addEventListener('pointerdown', startDrawing);
        window.addEventListener('pointerup', stopDrawing);
        canvas.addEventListener('pointermove', drawPath);
        canvas.addEventListener('pointerleave', stopDrawing);

        function loadLevel(index) {
            if (typeof Matter === 'undefined') {
                alert("物理引擎載入失敗！請重新整理網頁，或確認網路環境未阻擋 CDN。");
                return;
            }

            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            currentLevelIndex = index;
            isGameOver = false;
            
            document.getElementById('level-display').textContent = `關卡 ${currentLevelIndex}`;
            
            if (runner) Matter.Runner.stop(runner);
            if (engine) { Matter.Engine.clear(engine); Matter.Composite.clear(engine.world); }

            engine = Matter.Engine.create();
            engine.gravity.y = 1;

            drawnLines = [];
            allStrokes = [];
            obstacles = [];
            ball = null;
            isBallMoving = false;

            const data = LEVEL_DATA[index];

            goal = Matter.Bodies.circle(data.goalPos.x, data.goalPos.y, 45, {
                isStatic: true,
                isSensor: true,
                label: 'goal'
            });
            Matter.Composite.add(engine.world, goal);

            data.obstacles.forEach(obs => {
                const wall = Matter.Bodies.rectangle(obs.x, obs.y, obs.w, obs.h, {
                    isStatic: true,
                    friction: 0.1,
                    restitution: 0.5,
                    render: { w: obs.w, h: obs.h },
                    label: 'obstacle'
                });
                obstacles.push(wall);
                Matter.Composite.add(engine.world, wall);
            });

            Matter.Events.on(engine, 'collisionStart', (e) => {
                e.pairs.forEach(pair => {
                    const { bodyA, bodyB } = pair;
                    if ((bodyA.label === 'ball' && bodyB.label === 'goal') || (bodyB.label === 'ball' && bodyA.label === 'goal')) {
                        winLevel();
                    } else if (bodyA.label === 'ball' || bodyB.label === 'ball') {
                        if (ball && ball.speed > 2) playSound('bounce');
                    }
                });
            });

            const playBtn = document.getElementById('play-btn');
            playBtn.textContent = '▶️ 落下魔法球';
            playBtn.style.borderColor = 'var(--accent-green)';
            playBtn.style.color = 'var(--accent-green)';

            runner = Matter.Runner.create();
            Matter.Runner.run(runner, engine);
            requestAnimationFrame(customRender);
        }

        function togglePlay() {
            if (isGameOver) return;
            const playBtn = document.getElementById('play-btn');
            
            if (!isBallMoving) {
                isBallMoving = true;
                const data = LEVEL_DATA[currentLevelIndex];
                
                // 【核心修正2】球變重、無摩擦、無空氣阻力，徹底保留動能
                ball = Matter.Bodies.circle(data.ballStart.x, data.ballStart.y, 20, {
                    restitution: 0.5, 
                    friction: 0,    
                    density: 0.05, 
                    frictionAir: 0.001, 
                    label: 'ball'
                });
                Matter.Composite.add(engine.world, ball);

                playBtn.textContent = '↺ 重置球';
                playBtn.style.borderColor = 'var(--accent-gold)';
                playBtn.style.color = 'var(--accent-gold)';
            } else {
                resetPlayState();
            }
        }

        function resetPlayState() {
            isBallMoving = false;
            
            if (ball) {
                Matter.Composite.remove(engine.world, ball);
                ball = null;
            }
            
            const playBtn = document.getElementById('play-btn');
            playBtn.textContent = '▶️ 落下魔法球';
            playBtn.style.borderColor = 'var(--accent-green)';
            playBtn.style.color = 'var(--accent-green)';
        }

        function clearLines() {
            if (isGameOver) return;
            resetPlayState(); 
            drawnLines.forEach(line => Matter.Composite.remove(engine.world, line));
            drawnLines = [];
            allStrokes = [];
        }

        function winLevel() {
            if (isGameOver) return;
            isGameOver = true;
            playSound('win');
            
            if (currentLevelIndex >= unlockedLevel && unlockedLevel < TOTAL_LEVELS) {
                unlockedLevel = currentLevelIndex + 1;
            }

            setTimeout(() => {
                const overlay = document.getElementById('modal-overlay');
                const nextBtn = document.getElementById('next-level-btn');

                if (currentLevelIndex < TOTAL_LEVELS) {
                    nextBtn.style.display = 'inline-block';
                    document.getElementById('modal-desc').textContent = "魔法球成功進入了傳送門！";
                } else {
                    nextBtn.style.display = 'none';
                    document.getElementById('modal-desc').textContent = "恭喜你！成功破解所有魔法引導關卡！";
                }
                
                overlay.style.display = 'flex';
            }, 500);
        }

        function nextLevel() {
            if (currentLevelIndex < TOTAL_LEVELS) loadLevel(currentLevelIndex + 1);
            else returnToMenu();
        }

        let frameCount = 0;
        function customRender() {
            if (!document.getElementById('game-screen').style.display || document.getElementById('game-screen').style.display === 'none') return;
            frameCount++;

            if (isBallMoving && ball && !isGameOver) {
                if(ball.position.y > canvas.height + 60 || ball.position.x < -100 || ball.position.x > canvas.width + 100) {
                    resetPlayState();
                }
            }

            ctx.fillStyle = '#020617'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#334155';
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            obstacles.forEach(obs => {
                ctx.fillRect(obs.position.x - obs.render.w/2, obs.position.y - obs.render.h/2, obs.render.w, obs.render.h);
                ctx.strokeRect(obs.position.x - obs.render.w/2, obs.position.y - obs.render.h/2, obs.render.w, obs.render.h);
            });

            const goalScale = 1 + Math.sin(frameCount * 0.1) * 0.1;
            ctx.save();
            ctx.translate(goal.position.x, goal.position.y);
            ctx.scale(goalScale, goalScale);
            
            const gradient = ctx.createRadialGradient(0, 0, 10, 0, 0, 60);
            gradient.addColorStop(0, 'rgba(168, 85, 247, 1)');
            gradient.addColorStop(0.5, 'rgba(168, 85, 247, 0.5)');
            gradient.addColorStop(1, 'rgba(168, 85, 247, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath(); ctx.arc(0, 0, 60, 0, 2 * Math.PI); ctx.fill();
            
            ctx.fillStyle = '#e9d5ff';
            ctx.beginPath(); ctx.arc(0, 0, 20, 0, 2 * Math.PI); ctx.fill();
            ctx.restore();

            if (allStrokes.length > 0) {
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.shadowColor = '#06b6d4';
                ctx.shadowBlur = 15;
                ctx.strokeStyle = '#67e8f9';
                ctx.lineWidth = 12;

                ctx.beginPath();
                allStrokes.forEach(stroke => {
                    if (stroke.length > 0) {
                        ctx.moveTo(stroke[0].x, stroke[0].y);
                        for(let i=1; i<stroke.length; i++) {
                            ctx.lineTo(stroke[i].x, stroke[i].y);
                        }
                    }
                });
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();
            }

            const data = LEVEL_DATA[currentLevelIndex];
            ctx.save();
            
            if (isBallMoving && ball) {
                ctx.translate(ball.position.x, ball.position.y);
                ctx.rotate(ball.angle);
            } else {
                ctx.translate(data.ballStart.x, data.ballStart.y);
                ctx.globalAlpha = 0.5; 
            }
            
            ctx.shadowColor = '#ec4899';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#db2777';
            ctx.beginPath();
            ctx.arc(7, 7, 5, 0, 2 * Math.PI);
            ctx.fill();
            
            ctx.restore();

            requestAnimationFrame(customRender);
        }

    </script>
</body>
