<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>試管調色大師 - 想像力實驗室</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-color: #ffffff;
            --text-color: #0f172a;
            --accent-blue: #3b82f6;
            --accent-dark: #1e293b;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --tube-border: rgba(148, 163, 184, 0.4);
            --tube-glass: rgba(255, 255, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: manipulation; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* Logo */
        .logo-container {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--panel-color);
            padding: 10px 25px;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.15);
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--accent-blue);
            border: 2px solid var(--accent-blue);
            margin-bottom: 20px;
        }

        .game-wrapper {
            background: var(--panel-color);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px; /* 適合試管排列的寬度 */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #cbd5e1;
            position: relative;
            overflow: hidden;
        }

        /* 選單畫面 */
        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 10px;
            width: 100%;
            background: var(--panel-color);
        }

        .menu-title { 
            font-size: 2.8rem; font-weight: 900; margin-bottom: 15px; 
            color: var(--accent-purple); text-shadow: 0 4px 10px rgba(139, 92, 246, 0.2);
            text-align: center;
        }
        
        .rules-box {
            background: #f1f5f9;
            border: 2px solid var(--accent-purple);
            border-radius: 16px;
            padding: 20px 25px;
            margin-bottom: 30px;
            max-width: 500px;
            text-align: center;
        }
        .rules-title { font-weight: bold; font-size: 1.3rem; color: var(--accent-dark); margin-bottom: 10px; }
        .rules-desc { font-size: 1.1rem; color: #475569; line-height: 1.6; }

        .play-btn-large {
            background: var(--accent-purple); color: white; border: none; padding: 15px 50px;
            font-size: 1.5rem; font-weight: bold; border-radius: 40px; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
        }
        .play-btn-large:hover { transform: scale(1.05); }

        /* 遊戲畫面 */
        .game-screen { display: none; flex-direction: column; width: 100%; align-items: center; }

        .game-hud {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-bottom: 30px;
        }

        .hud-btn {
            background: white; border: 2px solid var(--accent-blue);
            padding: 8px 15px; border-radius: 15px; font-weight: bold; font-size: 1rem; cursor: pointer;
            color: var(--accent-blue); transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .hud-btn:hover { background: var(--accent-blue); color: white; }

        .level-display {
            background: var(--accent-blue); padding: 8px 25px; border-radius: 15px;
            font-weight: 900; font-size: 1.3rem; color: white;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        /* 試管容器區 */
        .tubes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            padding: 20px 0;
            min-height: 300px;
        }

        /* 試管本體 */
        .tube {
            width: 55px;
            height: 200px;
            border: 4px solid var(--tube-border);
            border-top: none;
            border-radius: 0 0 25px 25px;
            position: relative;
            background: var(--tube-glass);
            display: flex;
            flex-direction: column-reverse; /* 水從底部往上疊 */
            justify-content: flex-start;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 5px 15px rgba(0,0,0,0.05);
        }

        /* 試管被選取時上浮 */
        .tube.selected {
            transform: translateY(-25px);
            border-color: var(--accent-blue);
            box-shadow: inset 0 0 15px rgba(59, 130, 246, 0.2), 0 15px 25px rgba(0,0,0,0.15);
        }

        /* 玻璃反光特效 */
        .tube::after {
            content: '';
            position: absolute;
            top: 0; left: 5px; right: 50%; bottom: 10px;
            background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            border-radius: 0 0 0 20px;
            pointer-events: none;
        }

        /* 水塊 */
        .water-block {
            width: 100%;
            height: 25%; /* 每管最多 4 單位 */
            transition: height 0.3s ease-in-out;
            position: relative;
        }

        /* 水面微弧度 */
        .water-block.top-block {
            border-radius: 5px 5px 0 0;
        }
        
        /* 試管底部水波的圓角 */
        .water-block.bottom-block {
            border-radius: 0 0 20px 20px;
        }

        /* 彈出視窗 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 50; display: none; border-radius: 20px;
        }

        .modal-box {
            background: white; padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 4px solid var(--accent-green);
            transform: scale(0.9); animation: popIn 0.3s forwards; width: 85%; max-width: 350px;
        }

        @keyframes popIn { to { transform: scale(1); } }

        .modal-title { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; color: var(--accent-green); }
        .modal-desc { font-size: 1.2rem; color: #475569; margin-bottom: 25px; font-weight: bold; }
        
        .modal-btns { display: flex; gap: 15px; justify-content: center; }

        .m-btn {
            padding: 12px 25px; font-size: 1.2rem; font-weight: bold; border-radius: 30px;
            cursor: pointer; border: none; color: white; transition: transform 0.2s;
        }
        .m-btn:hover { transform: scale(1.05); }
        .btn-secondary { background: #94a3b8; }
        .btn-primary { background: var(--accent-green); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }

    </style>
</head>
<body>

    <div class="logo-container">
        <span>🧪</span>
        <span>想像力實驗室</span>
    </div>

    <div class="game-wrapper">
        
        <!-- 主選單 -->
        <div class="menu-screen" id="menu-screen">
            <h1 class="menu-title">試管調色大師</h1>
            
            <div class="rules-box">
                <div class="rules-title">📜 遊戲規則</div>
                <div class="rules-desc">
                    點擊 <strong>試管</strong> 將水倒出。<br>
                    只能倒入 <strong>空試管</strong> 或 <strong>最上層顏色相同</strong> 的試管中。<br>
                    將所有顏色分類，讓每個試管裡都只有 <strong>單一顏色</strong> 即可過關！
                </div>
            </div>
            
            <button class="play-btn-large" onclick="startGame()">開始挑戰</button>
        </div>

        <!-- 遊戲畫面 -->
        <div class="game-screen" id="game-screen">
            <div class="game-hud">
                <button class="hud-btn" onclick="returnToMenu()">❮ 選單</button>
                <div class="level-display" id="level-display">關卡 1</div>
                <div style="display: flex; gap: 10px;">
                    <button class="hud-btn" onclick="undoMove()">↶ 復原</button>
                    <button class="hud-btn" onclick="resetLevel()">↻ 重設</button>
                </div>
            </div>

            <!-- 試管動態生成區 -->
            <div class="tubes-container" id="tubes-container"></div>

            <!-- 彈出視窗 -->
            <div class="modal-overlay" id="modal-overlay">
                <div class="modal-box">
                    <h2 class="modal-title" id="modal-title">完美分類！</h2>
                    <p class="modal-desc" id="modal-desc">邏輯非常清晰喔！</p>
                    <div class="modal-btns">
                        <button class="m-btn btn-secondary" onclick="returnToMenu()">選單</button>
                        <button class="m-btn btn-primary" onclick="nextLevel()">下一關 ❯</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 音效系統 ---
        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                if (type === 'select') { 
                    osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                } else if (type === 'pour') { 
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                } else if (type === 'invalid') { 
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                } else if (type === 'win') { 
                    osc.type = 'square'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); 
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
                    osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                }
                
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.8);
            } catch (e) {}
        }

        // 定義漂亮的水滴顏色
        const COLORS = [
            '#ef4444', // 紅
            '#3b82f6', // 藍
            '#22c55e', // 綠
            '#f59e0b', // 黃
            '#a855f7', // 紫
            '#f97316', // 橘
            '#ec4899', // 粉
            '#14b8a6', // 藍綠
            '#84cc16', // 草綠
            '#6366f1'  // 靛
        ];

        let currentLevel = 1;
        let tubes = []; // 結構: [ ['red', 'blue'], ['green'], [] ]
        let historyStack = []; // 儲存上一步的陣列狀態
        let selectedTubeIndex = null;
        let isGameOver = false;

        const container = document.getElementById('tubes-container');

        function returnToMenu() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex';
        }

        function startGame() {
            currentLevel = 1;
            loadLevel(currentLevel);
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
        }

        function nextLevel() {
            currentLevel++;
            loadLevel(currentLevel);
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function resetLevel() {
            if (isGameOver) return;
            loadLevel(currentLevel);
        }

        function undoMove() {
            if (isGameOver || historyStack.length === 0) return;
            // 彈出歷史紀錄並還原
            tubes = historyStack.pop();
            selectedTubeIndex = null;
            playSound('select');
            renderTubes();
        }

        // --- 核心：保證有解的關卡生成器 ---
        function generateLevel(levelIdx) {
            // 決定難度：顏色數量與空管數量
            let numColors = Math.min(2 + Math.floor(levelIdx / 2), 10); // 隨關卡增加顏色，最多10種
            if (levelIdx === 1) numColors = 2; // 第1關：2色
            if (levelIdx === 2) numColors = 3; // 第2關：3色
            if (levelIdx === 3) numColors = 4; // 第3關：4色
            
            // 前 3 關給 1 個空管，後面給 2 個空管（防卡死）
            let numEmpty = (levelIdx <= 3) ? 1 : 2; 

            // 準備顏色池
            let pool = [];
            for (let i = 0; i < numColors; i++) {
                for (let j = 0; j < 4; j++) {
                    pool.push(COLORS[i]);
                }
            }

            // 隨機打亂演算法 (Fisher-Yates Shuffle)
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }

            // 分配到試管中
            let newState = [];
            let poolIdx = 0;
            for (let i = 0; i < numColors; i++) {
                let tube = [];
                for (let j = 0; j < 4; j++) {
                    tube.push(pool[poolIdx++]);
                }
                newState.push(tube);
            }
            
            // 加入空試管
            for (let i = 0; i < numEmpty; i++) {
                newState.push([]);
            }

            // 檢查：如果隨機出來剛好有一管是滿的且同色，就重洗一次，避免開局即完成
            let isTooEasy = false;
            for (let i = 0; i < numColors; i++) {
                if (newState[i].every(c => c === newState[i][0])) {
                    isTooEasy = true;
                    break;
                }
            }
            if (isTooEasy) return generateLevel(levelIdx); // 遞迴重來

            return newState;
        }

        function loadLevel(lv) {
            document.getElementById('level-display').textContent = `關卡 ${lv}`;
            isGameOver = false;
            selectedTubeIndex = null;
            historyStack = []; // 清空歷史
            tubes = generateLevel(lv);
            renderTubes();
        }

        // --- 視覺渲染 ---
        function renderTubes() {
            container.innerHTML = '';
            
            tubes.forEach((tubeData, index) => {
                let tubeEl = document.createElement('div');
                tubeEl.className = 'tube';
                if (selectedTubeIndex === index) {
                    tubeEl.classList.add('selected');
                }
                
                tubeEl.onclick = () => handleTubeClick(index);

                // 畫出裡面的水塊 (從陣列索引 0 開始畫，CSS 的 column-reverse 會自動把它擺在最底下)
                tubeData.forEach((color, blockIdx) => {
                    let block = document.createElement('div');
                    block.className = 'water-block';
                    block.style.backgroundColor = color;
                    
                    // 頂部弧度
                    if (blockIdx === tubeData.length - 1) {
                        block.classList.add('top-block');
                    }
                    // 底部弧度
                    if (blockIdx === 0) {
                        block.classList.add('bottom-block');
                    }
                    
                    tubeEl.appendChild(block);
                });

                container.appendChild(tubeEl);
            });
        }

        // --- 互動與傾倒邏輯 ---
        function handleTubeClick(index) {
            if (isGameOver) return;

            if (selectedTubeIndex === null) {
                // 尚未選取任何試管：只能選取非空的試管
                if (tubes[index].length > 0) {
                    selectedTubeIndex = index;
                    playSound('select');
                    renderTubes();
                }
            } else {
                // 已有選取的試管
                if (selectedTubeIndex === index) {
                    // 點擊同一個，取消選取
                    selectedTubeIndex = null;
                    playSound('select');
                    renderTubes();
                } else {
                    // 點擊不同試管，嘗試傾倒
                    if (canPour(selectedTubeIndex, index)) {
                        doPour(selectedTubeIndex, index);
                    } else {
                        // 無法傾倒，發出錯誤音效並取消選取
                        playSound('invalid');
                        selectedTubeIndex = null;
                        renderTubes();
                    }
                }
            }
        }

        function canPour(fromIdx, toIdx) {
            let fromTube = tubes[fromIdx];
            let toTube = tubes[toIdx];

            // 來源是空的
            if (fromTube.length === 0) return false;
            // 目標是滿的
            if (toTube.length === 4) return false;
            // 目標是空的 -> 隨便倒都可以
            if (toTube.length === 0) return true;

            // 目標有水 -> 必須最上層顏色相同
            let colorToPour = fromTube[fromTube.length - 1];
            let targetTopColor = toTube[toTube.length - 1];
            return colorToPour === targetTopColor;
        }

        function doPour(fromIdx, toIdx) {
            // 紀錄歷史狀態 (深拷貝)
            historyStack.push(JSON.parse(JSON.stringify(tubes)));

            let fromTube = tubes[fromIdx];
            let toTube = tubes[toIdx];
            
            let colorToPour = fromTube[fromTube.length - 1];
            
            // 計算來源管有幾個連續的同色水塊
            let blocksToMove = 0;
            for (let i = fromTube.length - 1; i >= 0; i--) {
                if (fromTube[i] === colorToPour) blocksToMove++;
                else break;
            }

            // 計算目標管剩下多少空間
            let spaceAvailable = 4 - toTube.length;
            
            // 實際能倒過去的數量
            let actualMove = Math.min(blocksToMove, spaceAvailable);

            // 執行資料搬移
            for (let i = 0; i < actualMove; i++) {
                toTube.push(fromTube.pop());
            }

            playSound('pour');
            selectedTubeIndex = null;
            renderTubes();
            checkWin();
        }

        function checkWin() {
            // 檢查是否每個試管都是「全空」或「裝滿了4格一模一樣的顏色」
            let win = true;
            for (let tube of tubes) {
                if (tube.length > 0) {
                    if (tube.length < 4) {
                        win = false; // 沒有裝滿
                        break;
                    }
                    // 裝滿了，檢查是否四格同色
                    let color = tube[0];
                    if (!tube.every(c => c === color)) {
                        win = false; // 顏色混雜
                        break;
                    }
                }
            }

            if (win) {
                isGameOver = true;
                setTimeout(() => {
                    playSound('win');
                    document.getElementById('modal-overlay').style.display = 'flex';
                }, 300); // 延遲一下讓最後一個水塊動畫跑完
            }
        }

    </script>
</body>
</html>
