<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叢林冒險遊戲 - 專案紀錄頁</title>
    <style>
        /* ================================================================= */
        /* 🎨 【魔法變色罐】與 0725index.html 完全同步的 6 個色彩變數！      */
        /* ================================================================= */
        :root {
            --main-color: #aa7fbf;      /* 1. 主色調：header背景、分區段落標題 */
            --accent-color: #d5b2ea;    /* 2. 強調色：主標題、返回按鈕文字、標籤文字 */
            --btn-hover: #6f1c93;       /* 3. 按鈕懸停色（同步首頁變數） */
            --bg-light: #9d79b5;        /* 4. 背景淺色：背景漸層上層、標籤背景色 */
            --bg-dark: #7300ff;         /* 5. 背景深色：背景漸層下層、圖片邊框 */
            --card-bg: #9702fa;         /* 6. 特殊卡片背景（同步首頁變數） */
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, var(--bg-light) 0%, var(--bg-dark) 100%);
            color: #2b2d42;
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
        }
        header {
            background-color: var(--main-color);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .back-btn {
            text-decoration: none;
            color: var(--accent-color);
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
        }
        .record-card {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }
        h1 { color: var(--accent-color); margin-top: 0; }
        h2 { color: var(--main-color); border-bottom: 2px solid var(--bg-light); padding-bottom: 10px; margin-top: 30px; }
        p { line-height: 1.8; color: #4b5563; }
        
        .main-img {
            width: 100%;
            border-radius: 16px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .flowchart-container {
            text-align: center;
            margin-top: 20px;
        }
        .flowchart-img {
            max-width: 100%;
            border: 1px solid var(--bg-dark);
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .tag {
            background: var(--bg-light);
            color: var(--accent-color);
            border: 1px solid var(--bg-dark);
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-right: 8px;
            display: inline-block;
        }
        footer { text-align: center; padding: 40px; color: #7c2d12; border-top: 1px solid var(--bg-dark); }
    </style>
</head>
<body>

    <header>
        <h1>🎮 專案開發紀錄：叢林冒險</h1>
        <p>從邏輯思想到遊戲實現的全過程</p>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn">← 返回我的秘密基地</a>

        <div class="record-card">
            <h2> 遊戲主題</h2>
            <p>這是一場驚險的叢林逃脫！障礙物有：磚塊,草叢,石頭和翼龍，跳過障礙物即可逃走。</p>
            <img src="遊戲畫面.png" alt="遊戲畫面" class="main-img">

            <h2>⚙️ 遊戲機制</h2>
            <p>
                <span class="tag">分數</span>
                <span class="tag">手裡劍</span>
                <span class="tag">跳起來的高度</span>
                <span class="tag">最高紀錄</span>
            </p>
            <p></p>

            <h2>🎨 遊戲素材</h2>
            <p>結合了 Scratch 內建資源加上AI生成的東西。</p>

            <h2>📜 邏輯流程圖 (Flowchart)</h2>
            <p>在動手寫程式前，我先規劃了遊戲的邏輯。從簡單的步驟到複雜的判斷邏輯：</p>
            
            <div class="flowchart-container">
                
                <p><strong>【詳細機制拆解】</strong></p>
                <img src="遊戲流程圖.png" alt="詳細機制" class="flowchart-img">

                <p><strong>【素材】</strong></p>
                <img src="遊戲素材圖.png" alt="素材庫" class="flowchart-img">
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 Imagination Lab 想像力實驗室. All Rights Reserved.</p>
    </footer>

</body>
</html>
